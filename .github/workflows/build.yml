name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        working-directory: ./Controller/ControllerApp2
        run: npm install

      - name: Add Android platform
        working-directory: ./Controller/ControllerApp2
        run: npx cap add android || true

      - name: Sync Capacitor
        working-directory: ./Controller/ControllerApp2
        run: npx cap sync android

      - name: Inject Android permissions
        working-directory: ./Controller/ControllerApp2/android/app/src/main
        run: |
          sed -i 's|<uses-permission android:name="android.permission.INTERNET"/>|<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.CAMERA"/>\n    <uses-permission android:name="android.permission.BLUETOOTH"/>\n    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN"/>\n    <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation"/>\n    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT"/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <uses-feature android:name="android.hardware.camera" android:required="false"/>|' AndroidManifest.xml

      - name: Make gradlew executable
        working-directory: ./Controller/ControllerApp2/android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: ./Controller/ControllerApp2/android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PC-Controller-APK
          path: Controller/ControllerApp2/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
