name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp pynput pyautogui pillow qrcode pyinstaller cryptography

      - name: Create admin manifest
        run: |
          @"
          <?xml version="1.0" encoding="UTF-8" standalone="yes"?>
          <assembly xmlns="urn:schemas-microsoft-com:asm.v1" manifestVersion="1.0">
            <trustInfo xmlns="urn:schemas-microsoft-com:asm.v3">
              <security>
                <requestedPrivileges>
                  <requestedExecutionLevel level="requireAdministrator" uiAccess="false"/>
                </requestedPrivileges>
              </security>
            </trustInfo>
          </assembly>
          "@ | Out-File -FilePath admin.manifest -Encoding UTF8

      - name: Build EXE
        run: |
          pyinstaller `
            --noconfirm `
            --onefile `
            --windowed `
            --name "PC Controller" `
            --add-data "controller.html;." `
            --manifest admin.manifest `
            --hidden-import aiohttp `
            --hidden-import aiohttp.web `
            --hidden-import aiohttp.web_runner `
            --hidden-import aiohttp.web_ws `
            --hidden-import pynput `
            --hidden-import pynput.keyboard `
            --hidden-import pynput.mouse `
            --hidden-import pyautogui `
            --hidden-import PIL `
            --hidden-import PIL.Image `
            --hidden-import PIL.ImageTk `
            --hidden-import qrcode `
            --hidden-import qrcode.image.pil `
            --hidden-import cryptography `
            --hidden-import cryptography.hazmat.primitives `
            --hidden-import cryptography.hazmat.backends `
            --hidden-import cryptography.x509 `
            server.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: PC-Controller-EXE
          path: "dist/PC Controller.exe"
          retention-days: 30
