name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp pynput pyautogui pillow qrcode pyinstaller

      - name: Build EXE
        run: |
          pyinstaller `
            --noconfirm `
            --onefile `
            --windowed `
            --name "PC Controller" `
            --add-data "controller.html;." `
            --hidden-import aiohttp `
            --hidden-import aiohttp.web `
            --hidden-import aiohttp.web_runner `
            --hidden-import aiohttp.web_ws `
            --hidden-import pynput `
            --hidden-import pynput.keyboard `
            --hidden-import pynput.mouse `
            --hidden-import pyautogui `
            --hidden-import PIL `
            --hidden-import PIL.Image `
            --hidden-import PIL.ImageTk `
            --hidden-import qrcode `
            --hidden-import qrcode.image.pil `
            server.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: PC-Controller-EXE
          path: "dist/PC Controller.exe"
          retention-days: 30
