<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no"/>
<title>PC Controller</title>
<meta name="theme-color" content="#0f1113">
<style>
  :root {
    --bg: #0f1113; --panel: #1a1c1e; --btn: #2a2d30;
    --accent: #3b82f6; --text: #e2e8f0; --muted: #94a3b8;
    --active: #22c55e; --red: #ef4444;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, sans-serif; overflow: hidden;
    user-select: none; -webkit-user-select: none;
  }

  /* ── CONNECT SCREEN ── */
  #connectScreen {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; height: 100%; padding: 32px;
  }
  #connectScreen h1 { font-size: 36px; font-weight: 800; margin-bottom: 8px; }
  #connectScreen p  { color: var(--muted); font-size: 15px; text-align: center;
                      margin-bottom: 36px; line-height: 1.5; }
  .card {
    width: 100%; background: var(--panel); border-radius: 16px;
    padding: 20px; margin-bottom: 16px;
    border: 1px solid #2a2d30;
  }
  .card label { font-size: 11px; color: var(--muted); font-weight: 700;
                text-transform: uppercase; letter-spacing: 1px; display: block;
                margin-bottom: 10px; }
  .card input {
    width: 100%; background: var(--btn); border: none; border-radius: 10px;
    padding: 14px; font-size: 20px; color: var(--text); letter-spacing: 1px;
    outline: none;
  }
  .card .hint { font-size: 12px; color: var(--muted); margin-top: 10px; }
  .connect-btn {
    width: 100%; background: var(--accent); border: none; border-radius: 14px;
    padding: 18px; font-size: 17px; font-weight: 800; color: #fff;
    margin-bottom: 20px; cursor: pointer;
  }
  .connect-btn:disabled { opacity: 0.4; }
  .tip { color: var(--muted); font-size: 13px; text-align: center; line-height: 1.6; }
  #connectError {
    color: var(--red); font-size: 13px; text-align: center;
    margin-bottom: 12px; display: none;
  }

  /* ── CONTROLLER SCREEN ── */
  #controllerScreen { display: none; height: 100%; flex-direction: column; }
  .wrap { padding: 12px; height: 100%; display: flex; flex-direction: column; }

  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .disc-btn { background: none; border: none; color: var(--muted); font-size: 13px; padding: 6px; }
  .status-pill { display: flex; align-items: center; gap: 6px; background: var(--panel);
                 padding: 4px 10px; border-radius: 20px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--red); }
  .dot.ok { background: var(--active); }
  .status-pill span { font-size: 12px; font-weight: 600; }

  .slider-box { display: flex; align-items: center; background: var(--panel);
                padding: 8px 12px; border-radius: 12px; margin-bottom: 10px;
                border: 1px solid #333; }
  .slider-label { font-size: 11px; color: var(--muted); font-weight: 700;
                  margin-right: 10px; width: 44px; }
  input[type=range] { flex: 1; accent-color: var(--accent); }

  .media-row { display: flex; gap: 8px; margin-bottom: 8px; }
  .icon-btn { background: var(--btn); border: none; border-radius: 12px;
              color: var(--text); padding: 12px; flex: 1;
              font-weight: 600; font-size: 13px; }
  .icon-btn:active { background: var(--accent); }

  #touchpad { flex: 1; background: var(--panel); border-radius: 16px;
              margin-bottom: 10px; position: relative; border: 1px solid #333;
              touch-action: none; }
  #touchpad:active { border-color: var(--accent); }
  .pad-hint { position: absolute; top: 50%; left: 50%;
              transform: translate(-50%, -50%); text-align: center;
              pointer-events: none; }
  .pad-hint p:first-child { color: #ffffff18; font-size: 22px; font-weight: 700; }
  .pad-hint p:last-child  { color: #ffffff12; font-size: 11px; margin-top: 4px; }

  .mouse-row { display: flex; gap: 10px; height: 52px; margin-bottom: 8px; }
  .mouse-btn { flex: 1; background: var(--btn); border: none; border-radius: 12px;
               color: var(--text); font-size: 14px; font-weight: 700; }
  .mouse-btn:active, .mouse-btn.active { background: var(--active); }

  .tool-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 4px; }
  .tool-btn { background: #222; color: var(--muted); border: 1px solid #333;
              padding: 12px; border-radius: 10px; font-size: 13px; font-weight: 600; }
  .tool-btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .tool-btn:active { opacity: 0.7; }

  #hiddenInput { position: fixed; top: -200px; left: 0; width: 1px; height: 1px; opacity: 0; }
</style>
</head>
<body>

<!-- ── CONNECT SCREEN ── -->
<div id="connectScreen">
  <h1>PC Controller</h1>
  <p>Enter your PC's IP address to connect over WiFi</p>

  <div class="card">
    <label>PC IP Address</label>
    <input type="text" id="ipInput" placeholder="192.168.1.42"
           inputmode="decimal" autocomplete="off" autocorrect="off"/>
    <div class="hint">Find the IP in the green box in the server window</div>
  </div>

  <div id="connectError">Could not connect — check IP and make sure server is running</div>

  <button class="connect-btn" id="connectBtn" onclick="startConnect()">Connect →</button>
  <p class="tip">📡 Phone and PC must be on the same WiFi network</p>
</div>

<!-- ── CONTROLLER SCREEN ── -->
<div id="controllerScreen">
  <div class="wrap">

    <div class="header">
      <button class="disc-btn" onclick="disconnect()">✕ Disconnect</button>
      <div class="status-pill">
        <div class="dot" id="dot"></div>
        <span id="statText">Connecting…</span>
      </div>
    </div>

    <div class="slider-box">
      <span class="slider-label">SPEED</span>
      <input type="range" min="0.5" max="5.0" step="0.1" value="1.5"
             oninput="setSpeed(this.value)">
    </div>

    <div class="media-row">
      <button class="icon-btn" onclick="sendKey('vol_down')">Vol -</button>
      <button class="icon-btn" onclick="sendKey('mute')">Mute</button>
      <button class="icon-btn" onclick="sendKey('vol_up')">Vol +</button>
    </div>
    <div class="media-row">
      <button class="icon-btn" onclick="sendKey('prev')">⏮</button>
      <button class="icon-btn" onclick="sendKey('play')">⏯</button>
      <button class="icon-btn" onclick="sendKey('next')">⏭</button>
    </div>

    <div id="touchpad">
      <div class="pad-hint">
        <p>TRACKPAD</p>
        <p>tap · drag · 2-finger scroll</p>
      </div>
    </div>

    <div class="mouse-row">
      <button class="mouse-btn" ontouchstart="clickBtn('left',event)">L</button>
      <button class="mouse-btn" id="dragBtn" onclick="toggleDrag()">🔓 Drag</button>
      <button class="mouse-btn" ontouchstart="clickBtn('right',event)">R</button>
    </div>

    <div class="mouse-row">
      <button class="mouse-btn" id="ctrlBtn" onclick="toggleMod('ctrl',this)">Ctrl</button>
      <button class="mouse-btn" id="altBtn"  onclick="toggleMod('alt',this)">Alt</button>
      <button class="mouse-btn" onclick="sendKey('win')">⊞ Win</button>
    </div>

    <div class="tool-grid">
      <button class="tool-btn primary" onclick="openKeyboard()">⌨ Type</button>
      <button class="tool-btn" onclick="sendKey('ENTER')">Enter</button>
      <button class="tool-btn" onclick="sendKey('BACKSPACE')">⌫ Back</button>
      <button class="tool-btn" onclick="sendKey('ESC')">Esc</button>
    </div>

  </div>
</div>

<input id="hiddenInput" type="text" autocomplete="off" autocorrect="off"
       autocapitalize="none" spellcheck="false"/>

<script>
// ── State ──
let ws = null, reconnectTimer = null;
let currentIp = '';
let isDragging = false;

// ── Connect / Disconnect ──
function startConnect() {
  const ip = document.getElementById('ipInput').value.trim();
  if (!ip) return;
  currentIp = ip;
  localStorage.setItem('lastIp', ip);
  document.getElementById('connectError').style.display = 'none';
  document.getElementById('connectScreen').style.display = 'none';
  document.getElementById('controllerScreen').style.display = 'flex';
  connect();
}

function connect() {
  if (ws) { ws.close(); ws = null; }
  ws = new WebSocket(`ws://${currentIp}:8080/ws`);
  ws.onopen  = () => { setStatus('Connected', true); };
  ws.onclose = () => {
    setStatus('Reconnecting…', false);
    reconnectTimer = setTimeout(connect, 2000);
  };
  ws.onerror = () => setStatus('Error', false);
}

function disconnect() {
  clearTimeout(reconnectTimer);
  if (ws) { ws.close(); ws = null; }
  if (isDragging) toggleDrag();
  document.getElementById('controllerScreen').style.display = 'none';
  document.getElementById('connectScreen').style.display   = 'flex';
}

function setStatus(text, ok) {
  document.getElementById('statText').textContent = text;
  document.getElementById('dot').className = 'dot' + (ok ? ' ok' : '');
}

// ── Send ──
function send(data) {
  if (ws && ws.readyState === 1) ws.send(JSON.stringify(data));
}
function vibrate() { if (navigator.vibrate) navigator.vibrate(15); }
function setSpeed(v) { send({command:'set_speed', value:v}); }
function sendKey(k)  { vibrate(); send({command:'key', key:k}); }
function clickBtn(btn, e) { if(e) e.preventDefault(); vibrate(); send({command:'click', button:btn}); }

// ── Drag ──
function toggleDrag() {
  isDragging = !isDragging;
  const btn = document.getElementById('dragBtn');
  btn.classList.toggle('active', isDragging);
  btn.textContent = isDragging ? '🔒 Dragging' : '🔓 Drag';
  if (navigator.vibrate) navigator.vibrate(isDragging ? [50] : [20]);
  send({command: isDragging ? 'drag_start' : 'drag_end'});
}

// ── Modifier keys ──
function toggleMod(key, btn) {
  const active = btn.classList.toggle('active');
  if (navigator.vibrate) navigator.vibrate(active ? 50 : 20);
  send({command:'key_toggle', key, state: active ? 'down' : 'up'});
}

// ── Touchpad ──
const pad = document.getElementById('touchpad');
let lastX=0, lastY=0, touchStartT=0, isScroll=false;

pad.addEventListener('touchstart', e => {
  e.preventDefault();
  if (e.touches.length === 1) {
    lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
    touchStartT = Date.now(); isScroll = false;
  } else if (e.touches.length === 2) {
    isScroll = true; lastY = e.touches[0].clientY;
  }
}, {passive:false});

pad.addEventListener('touchmove', e => {
  e.preventDefault();
  if (isScroll && e.touches.length === 2) {
    const cy = e.touches[0].clientY;
    send({command:'scroll', dy: cy - lastY}); lastY = cy;
  } else if (e.touches.length === 1) {
    const cx = e.touches[0].clientX, cy = e.touches[0].clientY;
    send({command:'move', dx: cx-lastX, dy: cy-lastY});
    lastX = cx; lastY = cy;
  }
}, {passive:false});

pad.addEventListener('touchend', e => {
  if (!isScroll && e.changedTouches.length===1 && (Date.now()-touchStartT < 150))
    clickBtn('left');
});

// ── Keyboard ──
const SPACER = ' ';
const hiddenInput = document.getElementById('hiddenInput');

function openKeyboard() {
  hiddenInput.value = SPACER;
  hiddenInput.focus();
}

hiddenInput.addEventListener('input', e => {
  if (e.data) { send({command:'type', text:e.data}); }
  else if (e.inputType === 'deleteContentBackward') { sendKey('BACKSPACE'); }
  else if (hiddenInput.value.length === 0) { sendKey('BACKSPACE'); }
  hiddenInput.value = SPACER;
});

hiddenInput.addEventListener('keyup', e => {
  if (e.key === 'Enter') sendKey('ENTER');
});

// ── Restore last IP ──
window.addEventListener('load', () => {
  const saved = localStorage.getItem('lastIp');
  if (saved) document.getElementById('ipInput').value = saved;
});
</script>
</body>
</html>
